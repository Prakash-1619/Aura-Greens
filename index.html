    // Hook for scroll animations
    function useFadeIn() {
      const ref = useRef(null);
      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          },
          { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
        );
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);
      return ref;
    }

    function FadeIn({ children, className = '', delay = 0 }) {
      const ref = useFadeIn();
      return (
        <div ref={ref} className={`animate-fade-up ${className}`} style={{ transitionDelay: `${delay}ms` }}>
          {children}
        </div>
      );
    }

      Phone: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>,
      Menu: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="18" y2="18"/></svg>,
      X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,

    };

    // Components
    function NavBar({ currentPage, setPage, cartCount, openCart }) {
      const [scrolled, setScrolled] = useState(false);
      const [mobileMenu, setMobileMenu] = useState(false);

        { id: 'about', label: 'About Us' },

        { id: 'contact', label: 'Contact & FAQ' }

            <FadeIn>
              <div className="text-center mb-16">
                <h2 className="font-display text-4xl sm:text-5xl font-bold text-primary">Wellness <span className="text-gradient-green italic">Subscriptions</span></h2>
                <p className="mt-4 text-gray-600 max-w-2xl mx-auto">Set it and forget it. Receive fresh microgreens automatically and save significantly.</p>
              </div>
            </FadeIn>

            <div className="grid md:grid-cols-3 gap-8">
              {SUBSCRIPTIONS.map((sub, i) => (
                <FadeIn key={sub.id} delay={i * 200}>
                  <div className={`p-8 rounded-[2rem] border-2 relative h-full flex flex-col ${sub.popular ? 'border-primary bg-primary text-white shadow-2xl shadow-primary/30 transform md:-translate-y-4' : 'border-light/50 bg-white'}`}>
                    {sub.popular && (
                      <div className="absolute -top-4 left-1/2 -translate-x-1/2 bg-accent text-primary text-xs font-bold px-4 py-1 rounded-full uppercase tracking-widest">
                        Most Popular
                      </div>
                    )}
                    <h3 className={`font-display text-3xl font-bold mb-2 ${sub.popular ? 'text-white' : 'text-primary'}`}>{sub.name}</h3>
                    <p className={`text-sm mb-8 ${sub.popular ? 'text-light' : 'text-gray-500'}`}>{sub.desc}</p>
                    
                    <div className="mt-auto">
                      <div className="flex items-baseline gap-2">
                        <span className="font-display text-4xl font-bold">₹{sub.price}</span>
                        <span className={`text-sm line-through ${sub.popular ? 'text-light/50' : 'text-gray-400'}`}>₹{sub.oldPrice}</span>
                      </div>
                      <div className={`text-sm mt-1 font-bold ${sub.popular ? 'text-accent' : 'text-primary'}`}>Billed {sub.frequency}</div>
                      
                      <button onClick={() => addToCart({ id: sub.id, name: sub.name, image: 'https://images.unsplash.com/photo-1595858270514-469b62c15982?w=800' }, sub.frequency, sub.price)} className={`w-full mt-8 py-4 rounded-full font-bold transition-transform hover:scale-105 ${sub.popular ? 'bg-white text-primary' : 'bg-bg text-primary border border-light'}`}>
                        Subscribe Now
                      </button>
                    </div>
                  </div>
                </FadeIn>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function PageContact() {
      const faqs = [
        { q: 'How long do they stay fresh?', a: 'When stored properly in the refrigerator in our specialized containers, Aura Greens microgreens stay fresh for 7-10 days.' },
        { q: 'How should I store them?', a: 'Keep them refrigerated between 2°C and 4°C. Avoid washing them until you are ready to consume them to prevent moisture buildup.' },
        { q: 'Are they organic?', a: 'While we are in the process of formal certification, we use 100% organic seeds, OMRI-listed soil, and absolutely zero pesticides or chemical fertilizers.' },
        { q: 'How are they delivered?', a: 'We harvest on the morning of your delivery day and dispatch them in temperature-controlled premium eco-friendly packaging straight to your door.' }
      ];

      return (
        <div className="pt-32 pb-24 min-h-screen bg-white">
          <div className="container mx-auto px-6 lg:px-20 max-w-5xl">
            <FadeIn className="text-center mb-16">
              <h1 className="font-display text-5xl font-bold text-primary">Contact & <span className="text-gradient-green italic">FAQ</span></h1>
            </FadeIn>

            <div className="grid md:grid-cols-2 gap-16">
              {/* Contact Info */}
              <FadeIn delay={200} className="bg-bg p-10 rounded-[2rem] border border-light/50">
                <h3 className="font-display text-3xl font-bold text-primary mb-8">Get in Touch</h3>
                <div className="space-y-6">
                  <div className="flex items-center gap-4">
                    <div className="w-12 h-12 rounded-full bg-white flex items-center justify-center text-primary shadow-sm"><Icons.Phone /></div>
                    <div>
                      <div className="text-xs font-bold text-gray-500 uppercase">Phone & WhatsApp</div>
                      <div className="font-bold text-primary text-xl">+91 93802 52292</div>
                    </div>
                  </div>
                  <div className="flex items-center gap-4">
                    <div className="w-12 h-12 rounded-full bg-white flex items-center justify-center text-primary shadow-sm"><Icons.Menu /></div>
                    <div>
                      <div className="text-xs font-bold text-gray-500 uppercase">Email</div>
                      <div className="font-bold text-primary text-xl">hello@auragreens.in</div>
                    </div>
                  </div>
                  <div className="flex items-center gap-4">
                    <div className="w-12 h-12 rounded-full bg-white flex items-center justify-center text-primary shadow-sm"><Icons.Leaf /></div>
                    <div>
                      <div className="text-xs font-bold text-gray-500 uppercase">Farm Location</div>
                      <div className="font-bold text-primary text-lg">HSR Layout, Bangalore</div>
                    </div>
                  </div>
                </div>
              </FadeIn>

              {/* FAQ */}
              <FadeIn delay={400}>
                <h3 className="font-display text-3xl font-bold text-primary mb-8">Frequent Questions</h3>
                <div className="space-y-4">
                  {faqs.map((faq, i) => (
                    <details key={i} className="group bg-bg rounded-2xl border border-light/30 overflow-hidden cursor-pointer">
                      <summary className="p-6 font-bold text-primary flex justify-between items-center outline-none">
                        {faq.q}
                        <span className="text-xl group-open:rotate-45 transition-transform">+</span>
                      </summary>
                      <div className="px-6 pb-6 text-gray-600 leading-relaxed border-t border-light/20 pt-4">
                        {faq.a}
                      </div>
                    </details>
                  ))}
                </div>
              </FadeIn>
            </div>
          </div>
        </div>
      );
    }

    function Cart({ cart, setCart, isOpen, closeCart }) {
      const total = cart.reduce((s, x) => s + x.price * x.qty, 0);

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(x => x.cartId === id ? { ...x, qty: Math.max(0, x.qty + delta) } : x).filter(x => x.qty > 0));
      };

      const handleWhatsAppCheckout = () => {
        if (cart.length === 0) return;
        const list = cart.map(x => `• ${x.name} (${x.packSize}) × ${x.qty} = ₹${x.price * x.qty}`).join('%0A');
        const msg = `Hi Aura Greens! 🌱 I'd like to place an order:%0A%0A${list}%0A%0A*Total: ₹${total}*`;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, '_blank');
      };

      return (
        <div className={`fixed inset-0 z-[100] transition-opacity duration-500 ${isOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
          <div className="absolute inset-0 bg-[#0A260D]/60 backdrop-blur-md transition-opacity" onClick={closeCart}></div>
          <div className={`absolute top-0 right-0 w-full max-w-md h-full bg-bg shadow-2xl transition-transform duration-[600ms] flex flex-col ${isOpen ? 'translate-x-0' : 'translate-x-full'}`}>
            <div className="p-8 border-b border-light/30 flex items-center justify-between">
              <h2 className="font-display text-3xl font-bold text-primary flex items-center gap-3">
                <Icons.Bag /> Your Cart
              </h2>
              <button onClick={closeCart} className="p-3 bg-white rounded-full hover:bg-light/20 transition-colors shadow-sm"><Icons.X /></button>
            </div>
            
            <div className="flex-1 overflow-y-auto p-8 space-y-5">
              {cart.length === 0 && (
                <div className="text-center py-32 opacity-50 flex flex-col items-center">
                  <div className="w-24 h-24 rounded-full bg-light/20 flex items-center justify-center mb-6">
                    <Icons.Leaf />
                  </div>
                  <p className="font-bold text-xl text-primary">Your cart is empty</p>
                </div>
              )}
              {cart.map(item => (
                <div key={item.cartId} className="flex gap-5 p-5 rounded-3xl bg-white border border-light/50 items-center shadow-sm">
                  <img src={item.image} alt={item.name} className="w-20 h-20 rounded-2xl object-cover" />
                  <div className="flex-1">
                    <div className="font-bold text-lg text-primary">{item.name}</div>
                    <div className="text-xs text-gray-500 uppercase tracking-widest mt-1">{item.packSize}</div>
                    <div className="flex items-center gap-4 mt-3">
                      <button onClick={() => updateQty(item.cartId, -1)} className="w-8 h-8 rounded-full bg-bg border border-light flex items-center justify-center font-bold text-primary hover:bg-light/30">-</button>
                      <span className="font-bold text-sm w-4 text-center">{item.qty}</span>
                      <button onClick={() => updateQty(item.cartId, 1)} className="w-8 h-8 rounded-full bg-bg border border-light flex items-center justify-center font-bold text-primary hover:bg-light/30">+</button>
                    </div>
                  </div>
                  <div className="font-display text-2xl font-bold text-primary">₹{item.price * item.qty}</div>
                </div>
              ))}
            </div>

            {cart.length > 0 && (
              <div className="p-8 border-t border-light/30 bg-white">
                <div className="flex justify-between items-center mb-8 text-2xl font-display font-bold text-primary">
                  <span>Total</span>
                  <span className="text-4xl">₹{total}</span>
                </div>
                <button onClick={handleWhatsAppCheckout} className="w-full bg-primary hover:bg-secondary text-white py-5 rounded-full font-bold text-lg flex items-center justify-center gap-3 transition-all hover:scale-[1.02] shadow-2xl shadow-primary/30">
                  <Icons.Phone /> Checkout via WhatsApp
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function Footer({ setPage }) {
      return (
        <footer className="bg-[#0A260D] text-white py-20 rounded-t-[3rem] mt-20 relative z-20">
          <div className="container mx-auto px-6 lg:px-20">
            <div className="grid md:grid-cols-3 gap-12 text-center md:text-left">
              <div>
                <h2 className="font-display text-4xl font-bold mb-4 text-light">Aura Greens</h2>
                <p className="text-light/70 text-sm uppercase tracking-widest mb-6">Fuel Your Aura</p>
                <p className="text-gray-400 text-sm leading-relaxed">Bringing farm-fresh, nutrient-dense microgreens directly to your doorstep in Bangalore.</p>
              </div>
              <div className="flex flex-col gap-3">
                <h3 className="font-bold text-xl text-white mb-2">Quick Links</h3>
                <button onClick={() => {setPage('home'); window.scrollTo(0,0);}} className="text-gray-400 hover:text-white md:text-left transition-colors">Home</button>
                <button onClick={() => {setPage('about'); window.scrollTo(0,0);}} className="text-gray-400 hover:text-white md:text-left transition-colors">About Us</button>
                <button onClick={() => {setPage('products'); window.scrollTo(0,0);}} className="text-gray-400 hover:text-white md:text-left transition-colors">Shop Greens</button>
                <button onClick={() => {setPage('contact'); window.scrollTo(0,0);}} className="text-gray-400 hover:text-white md:text-left transition-colors">FAQ & Contact</button>
              </div>
              <div>
                <h3 className="font-bold text-xl text-white mb-4">Newsletter</h3>
                <p className="text-gray-400 text-sm mb-4">Get healthy tips and exclusive offers.</p>
                <div className="flex border border-light/30 rounded-full overflow-hidden focus-within:border-light transition-colors">
                  <input type="email" placeholder="Email address" className="bg-transparent text-white px-6 py-3 outline-none w-full" />
                  <button className="bg-light text-primary font-bold px-6 py-3 hover:bg-white transition-colors">Join</button>
                </div>
              </div>
            </div>
            <div className="border-t border-light/20 mt-16 pt-8 text-center text-gray-500 text-sm">
              © 2026 Aura Greens. All rights reserved. HSR Layout, Bangalore.
            </div>
          </div>
        </footer>
      );
    }

    function App() {
      const [page, setPage] = useState('home');
      const [cart, setCart] = useState([]);
      const [cartOpen, setCartOpen] = useState(false);

      const addToCart = (product, packSize, overridePrice = null) => {
        const price = overridePrice || (packSize === '40g' ? product.price40 : product.price80);
        const cartId = `${product.id}-${packSize}`;
        setCart(prev => {
          const ex = prev.find(x => x.cartId === cartId);
          if (ex) return prev.map(x => x.cartId === cartId ? { ...x, qty: x.qty + 1 } : x);
          return [...prev, { cartId, id: product.id, name: product.name, packSize, price, qty: 1, image: product.image }];
        });
        setCartOpen(true);
      };

      const cartCount = cart.reduce((s, x) => s + x.qty, 0);

      return (
        <div>
          <NavBar currentPage={page} setPage={setPage} cartCount={cartCount} openCart={() => setCartOpen(true)} />
          
          <main>
            {page === 'home' && <PageHome setPage={setPage} />}
            {page === 'about' && <PageAbout />}
            {page === 'microgreens' && <PageMicrogreens />}
            {page === 'products' && <PageProducts addToCart={addToCart} />}
            {page === 'contact' && <PageContact />}
          </main>
          
          <Cart cart={cart} setCart={setCart} isOpen={cartOpen} closeCart={() => setCartOpen(false)} />
          <Footer setPage={setPage} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
