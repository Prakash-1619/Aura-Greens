<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Greens — Premium Microgreens</title>
  
  <!-- Fonts: Manrope & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --font-manrope: 'Manrope', sans-serif;
      --font-playfair: 'Playfair Display', serif;
    }
    body {
      font-family: var(--font-manrope);
      background-color: #F9FFF8;
      color: #222222;
      overflow-x: hidden;
      margin: 0;
    }
    .font-display { font-family: var(--font-playfair); }
    .glass {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .text-gradient-green {
      background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 50%, #66BB6A 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    /* Scroll Animation Utility */
    .animate-fade-up {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .animate-fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .animate-float { animation: float 4s ease-in-out infinite; }
    
    /* Custom Dock */
    .dock {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(165, 214, 167, 0.6);
      box-shadow: 0 20px 40px rgba(27, 94, 32, 0.15);
    }
    .dock-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 9999px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      color: #1B5E20;
      cursor: pointer;
    }
    .dock-item:hover {
      background: #E8F5E9;
      transform: scale(1.1) translateY(-5px);
    }
    .smooth-scroll { scroll-behavior: smooth; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1B5E20',
            secondary: '#2E7D32',
            accent: '#66BB6A',
            light: '#A5D6A7',
            bg: '#F9FFF8'
          }
        }
      }
    }
  </script>
</head>
<body class="smooth-scroll">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const PRODUCTS = [
      { id: 'broccoli', name: 'Broccoli', tagline: 'The Detox King', taste: 'Mild, slightly peppery', image: 'https://images.unsplash.com/photo-1587740916136-2767ed09210a?crop=entropy&cs=srgb&fm=jpg&ixid=M3w4NTYxOTF8MHwxfHNlYXJjaHwxfHxvcmdhbmljJTIwZ3JlZW5zfGVufDB8fHxncmVlbnwxNzg1MzQ5NDU4fDA&ixlib=rb-4.1.0&q=85', price40: 120, price80: 220, category: 'premium' },
      { id: 'beetroot', name: 'Beetroot', tagline: 'Ruby Powerhouse', taste: 'Earthy, subtly sweet', image: 'https://images.unsplash.com/photo-1618130070080-91f4d55a2383?crop=entropy&cs=srgb&fm=jpg&ixid=M3w4NjY2NzV8MHwxfHNlYXJjaHwxfHxmcmVzaCUyMGhlcmJzfGVufDB8fHxncmVlbnwxNzg1MzQ5NDc4fDA&ixlib=rb-4.1.0&q=85', price40: 120, price80: 220, category: 'premium' },
      { id: 'radish', name: 'Radish', tagline: 'Spicy Kick', taste: 'Sharp, peppery', image: 'https://images.unsplash.com/photo-1610697727433-aad689ce8104?crop=entropy&cs=srgb&fm=jpg&ixid=M3w4NjA1NjZ8MHwxfHNlYXJjaHwzfHxzcHJvdXRzfGVufDB8fHxncmVlbnwxNzg1MzQ5NDY1fDA&ixlib=rb-4.1.0&q=85', price40: 100, price80: 180, category: 'everyday' },
      { id: 'sunflower', name: 'Sunflower', tagline: 'Nutty Crunch', taste: 'Buttery, nutty', image: 'https://images.unsplash.com/photo-1527964105263-1ac6265a569f?crop=entropy&cs=srgb&fm=jpg&ixid=M3w4NjY2NzV8MHwxfHNlYXJjaHwyfHxmcmVzaCUyMGhlcmJzfGVufDB8fHxncmVlbnwxNzg1MzQ5NDc4fDA&ixlib=rb-4.1.0&q=85', price40: 130, price80: 240, category: 'everyday' },
      { id: 'wheatgrass', name: 'Wheatgrass', tagline: 'Green Superfood', taste: 'Grassy, fresh', image: 'https://images.unsplash.com/photo-1654659932057-5163eb80289d?crop=entropy&cs=srgb&fm=jpg&ixid=M3w3NTY2NzZ8MHwxfHNlYXJjaHwyfHx3aGVhdGdyYXNzfGVufDB8fHxncmVlbnwxNzg1MzQ5NDc4fDA&ixlib=rb-4.1.0&q=85', price40: 110, price80: 200, category: 'premium' },
      { id: 'chia', name: 'Chia', tagline: 'Omega-3 Boost', taste: 'Mild, herbaceous', image: 'https://images.unsplash.com/photo-1712019362859-2647bf42ea13?crop=entropy&cs=srgb&fm=jpg&ixid=M3w3NTY2NzZ8MHwxfHNlYXJjaHwxfHx3aGVhdGdyYXNzfGVufDB8fHxncmVlbnwxNzg1MzQ5NDc4fDA&ixlib=rb-4.1.0&q=85', price40: 140, price80: 260, category: 'premium' }
    ];

    const WHATSAPP_NUMBER = '919380252292';

    // Hook for intersection observer fade-ins
    function useFadeIn() {
      const ref = useRef(null);
      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          },
          { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
        );
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);
      return ref;
    }

    function FadeIn({ children, className = '', delay = 0 }) {
      const ref = useFadeIn();
      return (
        <div ref={ref} className={`animate-fade-up ${className}`} style={{ transitionDelay: `${delay}ms` }}>
          {children}
        </div>
      );
    }

    const IconLeaf = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>;
    const IconShoppingBag = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>;
    const IconPhone = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>;
    const IconHome = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const IconX = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;

    function Dock({ cartCount, openCart }) {
      return (
        <div className="dock">
          <a href="#hero" className="dock-item"><IconHome /></a>
          <a href="#products" className="dock-item"><IconLeaf /></a>
          <a href={`https://wa.me/${WHATSAPP_NUMBER}`} target="_blank" className="dock-item"><IconPhone /></a>
          <button onClick={openCart} className="dock-item relative">
            <IconShoppingBag />
            {cartCount > 0 && (
              <span className="absolute 0 -right-0 bg-red-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold shadow-md shadow-red-500/50">
                {cartCount}
              </span>
            )}
          </button>
        </div>
      );
    }

    function Hero() {
      return (
        <section id="hero" className="relative min-h-[100svh] flex items-center pt-20 overflow-hidden bg-bg">
          <div className="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1647613233075-e0d5546b0f22?crop=entropy&cs=srgb&fm=jpg&ixid=M3w3NTY2NzF8MHwxfHNlYXJjaHwxfHxtaWNyb2dyZWVuc3xlbnwwfHx8Z3JlZW58MTc4NTM0OTQ1OHww&ixlib=rb-4.1.0&q=85" alt="Fresh microgreens" className="w-full h-full object-cover opacity-[0.35]" />
            <div className="absolute inset-0 bg-gradient-to-r from-[#F9FFF8] via-[#F9FFF8]/80 to-transparent"></div>
          </div>
          <div className="container mx-auto px-6 lg:px-20 relative z-10">
            <div className="max-w-3xl">
              <FadeIn delay={0}>
                <div className="inline-flex items-center gap-3 px-5 py-2.5 rounded-full glass border border-light/50 mb-8 animate-float shadow-xl shadow-light/20">
                  <span className="w-3 h-3 rounded-full bg-accent animate-pulse"></span>
                  <span className="text-xs font-bold tracking-[0.2em] text-primary uppercase">Harvested Today • Bangalore</span>
                </div>
              </FadeIn>
              <FadeIn delay={200}>
                <h1 className="font-display text-6xl sm:text-8xl font-bold leading-[1.1] text-primary">
                  Fresh. <span className="text-gradient-green italic">Nutritious.</span><br />Alive.
                </h1>
              </FadeIn>
              <FadeIn delay={400}>
                <p className="mt-8 text-xl text-gray-700 max-w-xl leading-relaxed">
                  Fuel your body with freshly harvested premium microgreens, delivered directly to your doorstep. Grown with love, harvested only after you order.
                </p>
              </FadeIn>
              <FadeIn delay={600}>
                <div className="mt-12 flex flex-col sm:flex-row gap-4">
                  <a href="#products" className="bg-primary hover:bg-secondary text-white rounded-full h-16 px-10 text-lg font-bold shadow-2xl shadow-primary/40 flex items-center justify-center transition-all hover:scale-105">
                    Explore Premium Greens
                  </a>
                </div>
              </FadeIn>
            </div>
          </div>
        </section>
      );
    }

    function Products({ addToCart }) {
      return (
        <section id="products" className="py-32 bg-white rounded-t-[3rem] -mt-10 relative z-20 shadow-[0_-20px_50px_rgba(0,0,0,0.05)]">
          <div className="container mx-auto px-6 lg:px-20">
            <FadeIn>
              <div className="text-center mb-20">
                <div className="text-sm tracking-[0.3em] uppercase font-bold text-accent mb-4">Our Microgreens</div>
                <h2 className="font-display text-5xl sm:text-6xl font-bold text-primary">Premium <span className="text-gradient-green italic">Selection</span></h2>
              </div>
            </FadeIn>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-10">
              {PRODUCTS.map((p, i) => (
                <FadeIn key={p.id} delay={i * 100}>
                  <div className="group bg-bg rounded-[2rem] overflow-hidden border border-light/30 hover:shadow-2xl hover:shadow-primary/10 transition-all duration-700 hover:-translate-y-3">
                    <div className="relative h-72 overflow-hidden">
                      <img src={p.image} alt={p.name} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-[1.5s]" />
                      <div className="absolute top-5 left-5 glass px-4 py-2 rounded-full text-xs font-bold text-primary tracking-wider uppercase border border-white/50 shadow-md">
                        ✨ Fresh
                      </div>
                    </div>
                    <div className="p-8">
                      <div className="font-display text-4xl font-bold text-primary">{p.name}</div>
                      <div className="text-sm text-accent font-bold uppercase tracking-widest mt-2 mb-6">{p.tagline}</div>
                      <div className="mt-8 grid grid-cols-2 gap-4">
                        <button onClick={() => addToCart(p, '40g')} className="rounded-2xl border-2 border-light hover:border-primary bg-white p-5 text-left transition-colors group/btn relative overflow-hidden">
                          <div className="text-[10px] font-bold text-gray-500 uppercase tracking-widest relative z-10">40g Pack</div>
                          <div className="flex items-center justify-between mt-2 relative z-10">
                            <div className="font-display text-2xl font-bold text-primary">₹{p.price40}</div>
                            <div className="w-8 h-8 rounded-full bg-bg flex items-center justify-center group-hover/btn:bg-primary group-hover/btn:text-white transition-colors text-primary font-bold text-lg">+</div>
                          </div>
                        </button>
                        <button onClick={() => addToCart(p, '80g')} className="rounded-2xl bg-gradient-to-br from-primary to-[#0d3d10] text-white p-5 text-left transition-all hover:shadow-xl hover:shadow-primary/30 group/btn relative overflow-hidden">
                          <div className="text-[10px] font-bold text-light uppercase tracking-widest relative z-10">80g Pack</div>
                          <div className="flex items-center justify-between mt-2 relative z-10">
                            <div className="font-display text-2xl font-bold">₹{p.price80}</div>
                            <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center group-hover/btn:bg-white group-hover/btn:text-primary transition-colors font-bold text-lg">+</div>
                          </div>
                        </button>
                      </div>
                    </div>
                  </div>
                </FadeIn>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function Cart({ cart, setCart, isOpen, closeCart }) {
      const total = cart.reduce((s, x) => s + x.price * x.qty, 0);

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(x => x.cartId === id ? { ...x, qty: Math.max(0, x.qty + delta) } : x).filter(x => x.qty > 0));
      };

      const handleWhatsAppCheckout = () => {
        if (cart.length === 0) return;
        const list = cart.map(x => `• ${x.name} ${x.packSize} × ${x.qty} = ₹${x.price * x.qty}`).join('%0A');
        const msg = `Hi Aura Greens! 🌱 I'd like to place an order:%0A%0A${list}%0A%0A*Total: ₹${total}*`;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, '_blank');
      };

      return (
        <div className={`fixed inset-0 z-[100] transition-opacity duration-500 ${isOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
          <div className="absolute inset-0 bg-[#0A260D]/60 backdrop-blur-md transition-opacity" onClick={closeCart}></div>
          <div className={`absolute top-0 right-0 w-full max-w-md h-full bg-bg shadow-2xl transition-transform duration-[600ms] cubic-bezier(0.16, 1, 0.3, 1) flex flex-col ${isOpen ? 'translate-x-0' : 'translate-x-full'}`}>
            <div className="p-8 border-b border-light/30 flex items-center justify-between">
              <h2 className="font-display text-3xl font-bold text-primary flex items-center gap-3">
                <IconShoppingBag /> Your Cart
              </h2>
              <button onClick={closeCart} className="p-3 bg-white rounded-full hover:bg-light/20 transition-colors shadow-sm"><IconX /></button>
            </div>
            
            <div className="flex-1 overflow-y-auto p-8 space-y-5">
              {cart.length === 0 && (
                <div className="text-center py-32 opacity-50 flex flex-col items-center">
                  <div className="w-24 h-24 rounded-full bg-light/20 flex items-center justify-center mb-6">
                    <IconLeaf />
                  </div>
                  <p className="font-bold text-xl text-primary">Your cart is empty</p>
                </div>
              )}
              {cart.map(item => (
                <div key={item.cartId} className="flex gap-5 p-5 rounded-3xl bg-white border border-light/50 items-center shadow-sm">
                  <img src={item.image} alt={item.name} className="w-20 h-20 rounded-2xl object-cover" />
                  <div className="flex-1">
                    <div className="font-bold text-lg text-primary">{item.name}</div>
                    <div className="text-xs text-gray-500 uppercase tracking-widest mt-1">{item.packSize}</div>
                    <div className="flex items-center gap-4 mt-3">
                      <button onClick={() => updateQty(item.cartId, -1)} className="w-8 h-8 rounded-full bg-bg border border-light flex items-center justify-center font-bold text-primary hover:bg-light/30">-</button>
                      <span className="font-bold text-sm w-4 text-center">{item.qty}</span>
                      <button onClick={() => updateQty(item.cartId, 1)} className="w-8 h-8 rounded-full bg-bg border border-light flex items-center justify-center font-bold text-primary hover:bg-light/30">+</button>
                    </div>
                  </div>
                  <div className="font-display text-2xl font-bold text-primary">₹{item.price * item.qty}</div>
                </div>
              ))}
            </div>

            {cart.length > 0 && (
              <div className="p-8 border-t border-light/30 bg-white">
                <div className="flex justify-between items-center mb-8 text-2xl font-display font-bold text-primary">
                  <span>Total</span>
                  <span className="text-4xl">₹{total}</span>
                </div>
                <button onClick={handleWhatsAppCheckout} className="w-full bg-primary hover:bg-secondary text-white py-5 rounded-full font-bold text-lg flex items-center justify-center gap-3 transition-all hover:scale-[1.02] shadow-2xl shadow-primary/30">
                  <IconPhone /> Checkout via WhatsApp
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [cart, setCart] = useState([]);
      const [cartOpen, setCartOpen] = useState(false);

      const addToCart = (product, packSize) => {
        const price = packSize === '40g' ? product.price40 : product.price80;
        const cartId = `${product.id}-${packSize}`;
        setCart(prev => {
          const ex = prev.find(x => x.cartId === cartId);
          if (ex) return prev.map(x => x.cartId === cartId ? { ...x, qty: x.qty + 1 } : x);
          return [...prev, { cartId, id: product.id, name: product.name, packSize, price, qty: 1, image: product.image }];
        });
        setCartOpen(true);
      };

      const cartCount = cart.reduce((s, x) => s + x.qty, 0);

      return (
        <div>
          <Hero />
          <Products addToCart={addToCart} />
          
          <Dock cartCount={cartCount} openCart={() => setCartOpen(true)} />
          <Cart cart={cart} setCart={setCart} isOpen={cartOpen} closeCart={() => setCartOpen(false)} />
          
          <footer className="bg-[#0A260D] text-white py-20 text-center rounded-t-[3rem] mt-20">
            <h2 className="font-display text-4xl font-bold mb-4 text-light">Aura Greens</h2>
            <p className="text-light/70 text-sm uppercase tracking-widest">Fuel Your Aura</p>
            <p className="text-gray-400 text-sm mt-8">HSR Layout, Bangalore</p>
            <p className="text-gray-500 text-xs mt-12">© 2026 Aura Greens. All rights reserved.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
