    function App() {
      // 1. Load Products from localStorage or defaults
      const [products, setProducts] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY_PRODUCTS);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) { console.error(e); }
        return DEFAULT_PRODUCTS;
      });

      // 2. Load Global Settings from localStorage or defaults
      const [settings, setSettings] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY_SETTINGS);
          if (saved) return JSON.parse(saved);
        } catch (e) { console.error(e); }
        return DEFAULT_SETTINGS;
      });

      // 3. User Authentication & Profile
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY_USER);
          if (saved) return JSON.parse(saved);
        } catch (e) { console.error(e); }
        return null;
      });
      const [authModalOpen, setAuthModalOpen] = useState(false);

      // 4. Admin Auth State
      const [adminLoggedIn, setAdminLoggedIn] = useState(() => {
        return sessionStorage.getItem('goaura_admin_session') === 'true';
      });
      const [adminLoginModalOpen, setAdminLoginModalOpen] = useState(false);

      // Active Dedicated Tab: 'home', 'products', 'subscriptions', 'notebook', 'admin'
      const [activeTab, setActiveTab] = useState('home');

      // User Session & Location Tracking
      const [sessionSeconds, setSessionSeconds] = useState(0);
      const [userLocation, setUserLocation] = useState(currentUser?.location || 'HSR Layout, Bangalore');

      const [cart, setCart] = useState([]);
      const [cartOpen, setCartOpen] = useState(false);
      const [advisor, setAdvisor] = useState(false);
      const [aiChat, setAiChat] = useState(false);
      const [selected, setSelected] = useState(null);
      const [filter, setFilter] = useState('All');
      const [query, setQuery] = useState('');
      const [box, setBox] = useState([]);
      const [subscription, setSubscription] = useState('Weekly');
      const [toast, setToast] = useState('');
      const [mascotBubble, setMascotBubble] = useState(true);

      // Save products to localStorage
      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY_PRODUCTS, JSON.stringify(products)); } catch (e) { console.error(e); }
      }, [products]);

      // Save settings to localStorage
      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings)); } catch (e) { console.error(e); }
      }, [settings]);

      // Save user profile to localStorage
      useEffect(() => {
        try {
          if (currentUser) localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(currentUser));
          else localStorage.removeItem(STORAGE_KEY_USER);
        } catch (e) { console.error(e); }
      }, [currentUser]);

      // Live Session Timer & Tracking
      useEffect(() => {
        const timer = setInterval(() => {
          setSessionSeconds(s => s + 1);
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Auto Log Session to CRM
      useEffect(() => {
        if (currentUser) {
          try {
            const sessions = JSON.parse(localStorage.getItem(STORAGE_KEY_SESSIONS) || '[]');
            const existingIdx = sessions.findIndex(s => s.phone === currentUser.phone);
            const entry = {
              name: currentUser.name,
              phone: currentUser.phone,
              email: currentUser.email || '',
              location: currentUser.location || userLocation,
              verifiedAt: currentUser.verifiedAt,
              lastActive: new Date().toLocaleTimeString(),
              sessionSeconds: sessionSeconds,
              cartCount: cart.reduce((s, x) => s + x.qty, 0),
              cartTotal: cart.reduce((s, x) => s + x.price * x.qty, 0)
            };
            if (existingIdx >= 0) sessions[existingIdx] = entry;
            else sessions.push(entry);
            localStorage.setItem(STORAGE_KEY_SESSIONS, JSON.stringify(sessions));
          } catch (e) { console.error(e); }
        }
      }, [sessionSeconds, currentUser, cart, userLocation]);

      const add = (p, size = '40g') => {
        const price = size === '40g' ? (p.price40 || 120) : (p.price80 || 220);
        const id = p.id + '-' + size;
        setCart(c => {
          if (c.some(x => x.id === id)) {
            return c.map(x => x.id === id ? { ...x, qty: x.qty + 1 } : x);
          }
          return [...c, { id, p, size, price, qty: 1 }];
        });
        setToast(`Added ${p.name} (${size}) to basket`);
        setTimeout(() => setToast(''), 2400);
        setCartOpen(true);
      };

      const remove = id => setCart(c => c.filter(x => x.id !== id));
      const qty = (id, d) => setCart(c => c.map(x => x.id === id ? { ...x, qty: Math.max(1, x.qty + d) } : x));
      const cartTotal = cart.reduce((s, x) => s + x.price * x.qty, 0);
      const cartCount = cart.reduce((s, x) => s + x.qty, 0);

      const toggleBox = p => setBox(b => b.some(x => x.id === p.id) ? b.filter(x => x.id !== p.id) : [...b, p]);

      const filtered = products.filter(p => {
        const matchesQuery = p.name.toLowerCase().includes(query.toLowerCase()) ||
                             p.tagline.toLowerCase().includes(query.toLowerCase()) ||
                             (p.tags && p.tags.some(t => t.toLowerCase().includes(query.toLowerCase())));
        if (!matchesQuery) return false;
        if (filter === 'All') return true;
        if (filter === 'Everyday' || filter === 'Premium' || filter === 'Bold') return p.category === filter;
        if (filter === 'Detox & Fitness') return (p.tags && (p.tags.includes('detox') || p.tags.includes('fitness') || p.tags.includes('protein')));
        if (filter === 'Chef & Salads') return (p.tags && (p.tags.includes('chef') || p.tags.includes('salad')));
        return true;
      });

      const checkout = () => {
        if (!currentUser) {
          setAuthModalOpen(true);
          return;
        }
        const lines = cart.map(x => `• ${x.p.name} ${x.size} × ${x.qty} = ₹${x.price * x.qty}`).join('%0A');
        const msg = `Hi GoAura! 🌿%0A%0ACustomer: ${encodeURIComponent(currentUser.name)} (${currentUser.phone})%0ADelivery Area: ${encodeURIComponent(currentUser.location || userLocation)}%0A%0AOrder Items:%0A${lines}%0A%0ATotal Amount: ₹${cartTotal}%0A%0APlease confirm harvest schedule & delivery.`;
        window.open(`https://wa.me/${settings.whatsapp}?text=${msg}`, '_blank');
      };

      const handleTabSwitch = (tab) => {
        if (tab === 'admin' && !adminLoggedIn) {
          setAdminLoginModalOpen(true);
          return;
        }
        setActiveTab(tab);
      };

      return (
        <>
          {/* Top Announcement Marquee */}
          <div className="bg-[#05170d] text-goldLight text-[11px] py-1.5 px-4 font-semibold text-center border-b border-gold/20 flex items-center justify-center gap-3">
            <span className="w-2 h-2 rounded-full bg-leaf animate-pulse"></span>
            <span>{settings.announcement}</span>
            <a href={settings.instagramUrl} target="_blank" className="hidden md:inline-flex items-center gap-1 text-gold hover:underline">
              <Icon name="instagram" size={13} /> {settings.instagram}
            </a>
          </div>

          <Header
            settings={settings}
            activeTab={activeTab}
            setActiveTab={handleTabSwitch}
            cartCount={cartCount}
            openCart={() => setCartOpen(true)}
            openAdvisor={() => setAdvisor(true)}
            openAiChat={() => setAiChat(true)}
            currentUser={currentUser}
            openAuth={() => setAuthModalOpen(true)}
            logoutUser={() => { setCurrentUser(null); setToast('Signed out successfully.'); }}
            sessionSeconds={sessionSeconds}
          />
          
          <main className="min-h-screen pt-20">
            {/* 1. HOME & NARRATIVE TAB */}
            {activeTab === 'home' && (
              <>
                <Hero
                  settings={settings}
                  openAdvisor={() => setAdvisor(true)}
                  openAiChat={() => setAiChat(true)}
                  setActiveTab={setActiveTab}
                  currentUser={currentUser}
                />
                <TrustStrip />
                <WhatAreMicrogreens />
                <Story />
                <WhyMicrogreens />
                <AdvisorTeaser open={() => setAdvisor(true)} />
                <PersonaSection openAdvisor={() => setAdvisor(true)} />
                
                {/* Embedded preview of Catalog */}
                <Catalog
                  products={products}
                  filtered={filtered}
                  filter={filter}
                  setFilter={setFilter}
                  query={query}
                  setQuery={setQuery}
                  onSelect={setSelected}
                  add={add}
                  onExpand={() => setActiveTab('products')}
                />
                
                {/* Pure & Luxury Field Notebook */}
                <LuxuryNotebookSection
                  products={products}
                  onSelectGreen={(name) => {
                    const p = products.find(x => x.name.toLowerCase().includes(name.toLowerCase()));
                    if (p) setSelected(p);
                  }}
                  add={add}
                  currentUser={currentUser}
                  openAuth={() => setAuthModalOpen(true)}
                />

                <BuildBox products={products} box={box} toggle={toggleBox} add={add} />
                <Subscriptions settings={settings} value={subscription} setValue={setSubscription} />
                <Recipes onSelectGreen={(name) => {
                  const p = products.find(x => x.name.toLowerCase() === name.toLowerCase());
                  if (p) setSelected(p);
                }} />
                <Freshness />
                <Journal />
                <FinalCTA openAdvisor={() => setAdvisor(true)} />
              </>
            )}

            {/* 2. DEDICATED PRODUCTS PANTRY TAB */}
            {activeTab === 'products' && (
              <DedicatedProductsWindow
                products={products}
                filtered={filtered}
                filter={filter}
                setFilter={setFilter}
                query={query}
                setQuery={setQuery}
                onSelect={setSelected}
                add={add}
                openAiChat={() => setAiChat(true)}
              />
            )}

            {/* 3. DEDICATED SUBSCRIPTIONS & BOX BUILDER TAB */}
            {activeTab === 'subscriptions' && (
              <DedicatedSubscriptionsWindow
                settings={settings}
                products={products}
                box={box}
                toggle={toggleBox}
                add={add}
                value={subscription}
                setValue={setSubscription}
              />
            )}

            {/* 4. DEDICATED FIELD NOTEBOOK & NUTRITION TAB */}
            {activeTab === 'notebook' && (
              <div className="py-8">
                <LuxuryNotebookSection
                  products={products}
                  onSelectGreen={(name) => {
                    const p = products.find(x => x.name.toLowerCase().includes(name.toLowerCase()));
                    if (p) setSelected(p);
                  }}
                  add={add}
                  currentUser={currentUser}
                  openAuth={() => setAuthModalOpen(true)}
                />
              </div>
            )}

            {/* 5. DEDICATED ADMIN STUDIO PORTAL TAB */}
            {activeTab === 'admin' && (
              <AdminPortal
                settings={settings}
                setSettings={setSettings}
                products={products}
                setProducts={setProducts}
                onClose={() => setActiveTab('home')}
                onLogout={() => {
                  sessionStorage.removeItem('goaura_admin_session');
                  setAdminLoggedIn(false);
                  setActiveTab('home');
                  setToast('Signed out of Admin Studio.');
                }}
              />
            )}
          </main>

          <Footer settings={settings} setActiveTab={handleTabSwitch} />
          
          <MobileDock
            activeTab={activeTab}
            setActiveTab={handleTabSwitch}
            cartCount={cartCount}
            openCart={() => setCartOpen(true)}
            openAdvisor={() => setAdvisor(true)}
            openAiChat={() => setAiChat(true)}
          />

          {/* User Auth Modal with OTP Verification */}
          {authModalOpen && (
            <AuthModal
              close={() => setAuthModalOpen(false)}
              onVerified={(user) => {
                setCurrentUser(user);
                setAuthModalOpen(false);
                setToast(`Welcome, ${user.name}! Account verified.`);
              }}
              userLocation={userLocation}
              setUserLocation={setUserLocation}
            />
          )}

          {/* Admin Login Modal (aura_green / aura@0704) */}
          {adminLoginModalOpen && (
            <AdminLoginModal
              close={() => setAdminLoginModalOpen(false)}
              onSuccess={() => {
                sessionStorage.setItem('goaura_admin_session', 'true');
                setAdminLoggedIn(true);
                setAdminLoginModalOpen(false);
                setActiveTab('admin');
                setToast('Welcome to GoAura Admin Studio!');
              }}
            />
          )}

          {/* Cart, Product, Advisor Modals */}
          {cartOpen && <CartModal cart={cart} total={cartTotal} close={() => setCartOpen(false)} remove={remove} qty={qty} checkout={checkout} currentUser={currentUser} openAuth={() => setAuthModalOpen(true)} />}
          {selected && <ProductModal p={selected} close={() => setSelected(null)} add={add} openAiChat={() => { setSelected(null); setAiChat(true); }} />}
          {advisor && <AdvisorModal close={() => setAdvisor(false)} products={products} add={add} />}
          
          {/* ✨ Supercharged Interactive AI Concierge with Broccy Mascot */}
          {aiChat && (
            <AIChatModal
              settings={settings}
              currentUser={currentUser}
              userLocation={userLocation}
              products={products}
              close={() => setAiChat(false)}
              openAdvisor={() => { setAiChat(false); setAdvisor(true); }}
              onSelectProduct={(p) => setSelected(p)}
              add={add}
              box={box}
              toggleBox={toggleBox}
            />
          )}

          {/* Floating Mascot Trigger with Broccy Avatar & Animated Speech Bubble */}
          <div className="fixed z-40 right-5 bottom-24 md:bottom-7 md:right-7 flex items-end gap-3 group">
            {mascotBubble && (
              <div className="hidden sm:flex items-center gap-2.5 bg-white border border-forest/15 text-forest p-3 rounded-2xl shadow-2xl text-xs font-semibold max-w-[230px] relative animate-fade-in">
                <span>{currentUser ? `Hey ${currentUser.name.split(' ')[0]}!` : "Psst!"} I’m <strong>Broccy</strong> 🥦 Need green advice?</span>
                <button onClick={() => setMascotBubble(false)} className="text-forest/40 hover:text-forest">
                  <Icon name="x" size={12} />
                </button>
                <div className="absolute -right-2 bottom-4 w-0 h-0 border-t-[6px] border-t-transparent border-b-[6px] border-b-transparent border-l-[8px] border-l-white"></div>
              </div>
            )}

    /* ---------------- USER AUTHENTICATION & OTP VERIFICATION MODAL ---------------- */
    function AuthModal({ close, onVerified, userLocation, setUserLocation }) {
      const [step, setStep] = useState('phone'); // 'phone' or 'otp'
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [email, setEmail] = useState('');
      const [area, setArea] = useState(userLocation);
      const [otpInput, setOtpInput] = useState('');
      const [generatedOtp, setGeneratedOtp] = useState('');
      const [timer, setTimer] = useState(60);
      const [isSending, setIsSending] = useState(false);

      const bangaloreAreas = ['HSR Layout', 'Koramangala', 'Indiranagar', 'Whitefield', 'Jayanagar', 'JP Nagar', 'Bellandur', 'Sarjapur Road', 'BTM Layout', 'Richmond Town', 'Malleshwaram'];

      const handleGetLocation = () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const detected = `Bangalore Lat: ${pos.coords.latitude.toFixed(3)}, Lng: ${pos.coords.longitude.toFixed(3)}`;
              setArea(detected);
              setUserLocation(detected);
            },
            () => setArea('HSR Layout, Bangalore (Default)')
          );
        }
      };

      const handleSendOtp = (e) => {
        e.preventDefault();
        if (!name.trim()) return alert('Please enter your full name');
        if (phone.replace(/\D/g, '').length < 10) return alert('Please enter a valid 10-digit mobile number');

        setIsSending(true);
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        setGeneratedOtp(code);

        setTimeout(() => {
          setIsSending(false);
          setStep('otp');
          setTimer(60);
        }, 600);
      };

      const handleVerifyOtp = (e) => {
        e.preventDefault();
        if (otpInput.trim() === generatedOtp || otpInput.trim() === '7042') {
          const userObj = {
            name: name.trim(),
            phone: phone.trim(),
            email: email.trim(),
            location: area,
            verifiedAt: new Date().toLocaleString()
          };
          onVerified(userObj);
        } else {
          alert('Invalid OTP code. Please check the simulated SMS alert.');
        }
      };

      return (
        <div className="fixed inset-0 z-[130] modal-bg flex items-center justify-center p-4" onClick={close}>
          <div className="bg-ivory rounded-[2.5rem] max-w-md w-full p-6 md:p-8 shadow-2xl border border-forest/15 relative" onClick={e => e.stopPropagation()}>
            <button onClick={close} className="absolute top-5 right-5 w-9 h-9 rounded-full bg-white grid place-items-center shadow-sm hover:scale-105 cursor-pointer">
              <Icon name="x" size={17} />
            </button>

            {step === 'phone' ? (
              <form onSubmit={handleSendOtp} className="space-y-4">
                <div className="text-center pb-2">
                  <div className="w-14 h-14 rounded-full bg-forest text-leaf grid place-items-center mx-auto mb-3 shadow-md">
                    <Icon name="user" size={24} />
                  </div>
                  <h3 className="display text-2xl font-bold text-forest">Verify Your Contact</h3>
                  <p className="text-xs text-forest/60 mt-1">Unlock seamless ordering, custom box builder & the luxury field guide.</p>
                </div>

                <div>
                  <label className="block text-xs font-bold text-forest/70 mb-1">Full Name *</label>
                  <input
                    required
                    value={name}
                    onChange={e => setName(e.target.value)}
                    placeholder="e.g. Ananya Sharma"
                    className="w-full bg-white border border-forest/15 rounded-xl px-3.5 py-2.5 text-xs outline-none focus:ring-2 focus:ring-leaf/50"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-forest/70 mb-1">WhatsApp / Contact Number (10 digits) *</label>
                  <div className="flex gap-2">
                    <span className="bg-sage border border-forest/15 px-3 py-2.5 rounded-xl text-xs font-bold text-forest">+91</span>
                    <input
                      required
                      type="tel"
                      maxLength="10"
                      value={phone}
                      onChange={e => setPhone(e.target.value.replace(/\D/g, ''))}
                      placeholder="98765 43210"
                      className="flex-1 bg-white border border-forest/15 rounded-xl px-3.5 py-2.5 text-xs outline-none focus:ring-2 focus:ring-leaf/50"
                    />
                  </div>
                </div>

                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-xs font-bold text-forest/70">Bangalore Delivery Area *</label>
                    <button type="button" onClick={handleGetLocation} className="text-[10px] text-botanical font-bold hover:underline flex items-center gap-1">
                      <Icon name="mapPin" size={11} /> Auto-Detect
                    </button>
                  </div>
                  <select
                    value={area}
                    onChange={e => { setArea(e.target.value); setUserLocation(e.target.value); }}
                    className="w-full bg-white border border-forest/15 rounded-xl px-3.5 py-2.5 text-xs outline-none"
                  >
                    {bangaloreAreas.map(a => (
                      <option key={a} value={a}>{a}</option>
                    ))}
                  </select>
                </div>

                <button
                  type="submit"
                  disabled={isSending}
                  className="w-full bg-forest text-white rounded-full py-3.5 text-xs font-bold hover:bg-botanical shadow-md transition-all mt-2 cursor-pointer"
                >
                  {isSending ? 'Generating OTP...' : 'Send Verification OTP →'}
                </button>
              </form>
            ) : (
              <form onSubmit={handleVerifyOtp} className="space-y-5">
                <div className="text-center">
                  <div className="w-14 h-14 rounded-full bg-leaf text-forest grid place-items-center mx-auto mb-3 shadow-md font-bold text-xl">
                    ✓
                  </div>
                  <h3 className="display text-2xl font-bold text-forest">Enter 4-Digit OTP</h3>
                  <p className="text-xs text-forest/60 mt-1">Sent to <strong>+91 {phone}</strong></p>
                </div>

                {/* Simulated SMS Alert Box */}
                <div className="bg-sage border border-botanical/30 rounded-2xl p-4 text-center">
                  <div className="text-[10px] uppercase tracking-wider text-botanical font-bold">📲 Simulated SMS Notification:</div>
                  <div className="display text-3xl font-bold text-forest tracking-widest mt-1">{generatedOtp}</div>
                  <div className="text-[10px] text-forest/50 mt-1">(Use code above or demo bypass 7042)</div>
                </div>

                <div>
                  <input
                    type="text"
                    maxLength="4"

                    onChange={e => setOtpInput(e.target.value.replace(/\D/g, ''))}

                  <button type="button" onClick={() => setStep('phone')} className="hover:underline">
                    ← Change Details

                  <span>Resend in {timer}s</span>
                </div>
              </form>
            )}

        </div>

                  <span className="w-2 h-2 rounded-full bg-leaf animate-bounce"></span>
                  <span className="w-2 h-2 rounded-full bg-leaf animate-bounce" style={{ animationDelay: '0.2s' }}></span>
                  <span className="w-2 h-2 rounded-full bg-leaf animate-bounce" style={{ animationDelay: '0.4s' }}></span>
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>

            {/* Quick Prompts */}
            <div className="p-3 bg-white border-t border-forest/10 flex gap-2 overflow-x-auto hide-scrollbar">
              {prompts.map(p => (
                <button
                  key={p}
                  onClick={() => handleQuery(p)}
                  className="shrink-0 text-[11px] bg-sage border border-forest/10 rounded-full px-3.5 py-1.5 text-forest font-semibold hover:bg-forest hover:text-white transition-all shadow-sm cursor-pointer"
                >
                  {p}
                </button>
              ))}
            </div>

            {/* Free Form Input Bar */}
            <div className="p-4 bg-white border-t border-forest/10 flex items-center gap-2">
              <input
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleQuery(input)}
                placeholder="Ask Broccy anything about microgreens…"
                className="flex-1 bg-ivory border border-forest/15 rounded-full px-4 py-3 text-xs outline-none focus:ring-2 focus:ring-leaf/50"
              />
              <button
                onClick={() => handleQuery(input)}
                disabled={!input.trim()}
                className="w-11 h-11 rounded-full bg-forest text-white grid place-items-center disabled:opacity-30 hover:bg-botanical transition-all shadow-md shrink-0 cursor-pointer"
              >
                <Icon name="send" size={16} />
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render App into DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
